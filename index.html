<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Spatial Awareness Map (SAM)</title>

<script async src="https://docs.opencv.org/4.x/opencv.js"
onload="opencvLoaded()"></script>

<style>
html,body{margin:0;height:100%;overflow:hidden;font-family:Arial,sans-serif;background:#000}
#camera,#overlay{position:fixed;inset:0;width:100%;height:100%;object-fit:cover}
#overlay{pointer-events:none}
#info{
position:absolute;top:15px;left:15px;
background:rgba(0,0,0,.45);
backdrop-filter:blur(10px);
padding:12px 16px;
border-radius:12px;
color:#fff;
font-size:15px;
line-height:1.6;
min-width:190px;
}
#title{font-weight:bold;font-size:18px;margin-bottom:6px}
#debug{
position:absolute;
bottom:15px;
left:15px;
background:rgba(0,0,0,.45);
padding:6px 10px;
border-radius:8px;
font-size:13px;
color:#0f0;
}
</style>
</head>
<body>

<video id="camera" autoplay playsinline muted></video>
<canvas id="overlay"></canvas>
<canvas id="processing" hidden></canvas>

<div id="info">
<div id="title">Spatial Awareness Map</div>
<div>Lat : <span id="lat">--</span></div>
<div>Lon : <span id="lon">--</span></div>
<div>Acc : <span id="acc">--</span></div>
</div>

<div id="debug">Loading OpenCV...</div>

<script>
const video=document.getElementById("camera");
const overlay=document.getElementById("overlay");
const proc=document.getElementById("processing");
const dbg=document.getElementById("debug");
let cvReady=false;

async function startCamera(){
 const s=await navigator.mediaDevices.getUserMedia({
   video:{facingMode:{ideal:"environment"}},audio:false});
 video.srcObject=s;
}

function startGPS(){
 navigator.geolocation.watchPosition(p=>{
  lat.textContent=p.coords.latitude.toFixed(6);
  lon.textContent=p.coords.longitude.toFixed(6);
  acc.textContent="±"+p.coords.accuracy.toFixed(1)+" m";
 });
}

function opencvLoaded(){
 const wait=()=>{
   if(window.cv && cv.Mat){
      cv.onRuntimeInitialized=()=>{
        cvReady=true;
        dbg.textContent="OpenCV Ready";
        requestAnimationFrame(processFrame);
      };
   }else setTimeout(wait,100);
 };
 wait();
}

function processFrame(){
 if(!cvReady || video.readyState<2){
   requestAnimationFrame(processFrame);return;
 }

 overlay.width=video.videoWidth;
 overlay.height=video.videoHeight;
 proc.width=video.videoWidth;
 proc.height=video.videoHeight;

 const pctx=proc.getContext("2d");
 pctx.drawImage(video,0,0);

 let src=cv.imread(proc);
 let gray=new cv.Mat();
 let thr=new cv.Mat();
 cv.cvtColor(src,gray,cv.COLOR_RGBA2GRAY);
 cv.adaptiveThreshold(gray,thr,255,
   cv.ADAPTIVE_THRESH_GAUSSIAN_C,
   cv.THRESH_BINARY_INV,21,5);

 let contours=new cv.MatVector();
 let hierarchy=new cv.Mat();
 cv.findContours(thr,contours,hierarchy,
   cv.RETR_TREE,cv.CHAIN_APPROX_SIMPLE);

 const ctx=overlay.getContext("2d");
 ctx.clearRect(0,0,overlay.width,overlay.height);
 ctx.strokeStyle="#00ff00";
 ctx.lineWidth=2;

 let squares=0;
 for(let i=0;i<contours.size();i++){
   let c=contours.get(i);
   let approx=new cv.Mat();
   cv.approxPolyDP(c,approx,0.02*cv.arcLength(c,true),true);

   if(approx.rows===4 && cv.contourArea(approx)>500){
      squares++;
      ctx.beginPath();
      ctx.moveTo(approx.intPtr(0,0)[0],approx.intPtr(0,0)[1]);
      for(let j=1;j<4;j++)
        ctx.lineTo(approx.intPtr(j,0)[0],approx.intPtr(j,0)[1]);
      ctx.closePath();
      ctx.stroke();
   }
   approx.delete();
   c.delete();
 }

 dbg.textContent="Squares: "+squares;

 src.delete();gray.delete();thr.delete();
 contours.delete();hierarchy.delete();

 requestAnimationFrame(processFrame);
}

startCamera();
startGPS();
</script>
</body>
</html>
