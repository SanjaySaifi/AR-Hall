<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
               maximum-scale=1.0, user-scalable=no">

<title>Uji Hazard Map – Live Location</title>

<link rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      crossorigin=""/>

<style>
    html, body {
        height: 100%;
        margin: 0;
        font-family: Arial, sans-serif;
        background: #111;
    }

    #map {
        width: 100%;
        height: 100%;
    }

    .panel {
        position: fixed;
        z-index: 1000;
        top: 12px;
        left: 12px;
        right: 12px;
        max-width: 360px;
        padding: 14px;
        background: rgba(255,255,255,.95);
        border-radius: 12px;
        box-shadow: 0 3px 15px rgba(0,0,0,.25);
    }

    .title {
        font-size: 17px;
        font-weight: 700;
        margin-bottom: 8px;
    }

    .status {
        font-size: 13px;
        line-height: 1.5;
        margin-bottom: 10px;
    }

    button {
        border: 0;
        border-radius: 8px;
        padding: 10px 13px;
        font-size: 14px;
        font-weight: 600;
        background: #1976d2;
        color: white;
        cursor: pointer;
    }

    button:active {
        transform: scale(.98);
    }

    .leaflet-control-attribution {
        font-size: 9px;
    }

    .location-dot {
        width: 18px;
        height: 18px;
        background: #1677ff;
        border: 3px solid white;
        border-radius: 50%;
        box-shadow:
            0 0 0 2px rgba(22,119,255,.35),
            0 2px 5px rgba(0,0,0,.35);
    }

    @media (max-width: 600px) {
        .panel {
            top: 8px;
            left: 8px;
            right: 8px;
        }
    }
</style>
</head>

<body>

<div id="map"></div>

<div class="panel">
    <div class="title">Uji Flood Hazard Map</div>

    <div id="status" class="status">
        Loading map coordinates...
    </div>

    <button onclick="startLocation()">
        📍 Show My Location
    </button>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        crossorigin=""></script>

<script>

/* =========================================================
   GLOBAL VARIABLES
   ========================================================= */

let map = null;
let locationMarker = null;
let accuracyCircle = null;
let watchId = null;


/* =========================================================
   LOAD CSV AND CREATE MAP
   ========================================================= */

async function loadMap() {

    const status = document.getElementById("status");

    try {

        status.innerHTML = "Loading corner coordinates...";

        /*
         * The CSV must be in the same folder as this HTML file.
         *
         * Expected CSV:
         *
         * id,lat,long
         * 1,34.94658966,135.785953
         * 2,34.94658966,135.8294458
         * 3,34.89586995,135.785953
         * 4,34.89593565,135.8294458
         */

        const response = await fetch("corners.csv", {
            cache: "no-store"
        });

        if (!response.ok) {
            throw new Error(
                "Could not load corners.csv. " +
                "Make sure it is in the same folder as this HTML file."
            );
        }

        let csvText = await response.text();

        /*
         * Remove UTF-8 BOM if present.
         */
        csvText = csvText.replace(/^\uFEFF/, "");

        /*
         * Split CSV into rows.
         */
        const rows = csvText
            .trim()
            .split(/\r?\n/);

        if (rows.length < 5) {
            throw new Error(
                "corners.csv must contain a header and 4 coordinate rows."
            );
        }

        /*
         * Store coordinates using ID.
         *
         * points[1] = [latitude, longitude]
         * points[2] = [latitude, longitude]
         * points[3] = [latitude, longitude]
         * points[4] = [latitude, longitude]
         */
        const points = {};

        /*
         * Skip row 0 because it is the header.
         */
        for (let i = 1; i < rows.length; i++) {

            if (!rows[i].trim()) {
                continue;
            }

            const columns = rows[i].split(",");

            if (columns.length < 3) {
                continue;
            }

            const id = parseInt(
                columns[0].trim(),
                10
            );

            const lat = parseFloat(
                columns[1].trim()
            );

            const lon = parseFloat(
                columns[2].trim()
            );

            if (
                Number.isInteger(id) &&
                Number.isFinite(lat) &&
                Number.isFinite(lon)
            ) {
                points[id] = [lat, lon];
            }
        }


        /* =====================================================
           CHECK REQUIRED CORNER POINTS
           ===================================================== */

        if (!points[1]) {
            throw new Error("ID 1 is missing from corners.csv.");
        }

        if (!points[2]) {
            throw new Error("ID 2 is missing from corners.csv.");
        }

        if (!points[3]) {
            throw new Error("ID 3 is missing from corners.csv.");
        }

        if (!points[4]) {
            throw new Error("ID 4 is missing from corners.csv.");
        }


        /* =====================================================
           ASSIGN CORNER POSITIONS
           ===================================================== */

        // ID 1 = Top Left
        const topLeft = points[1];

        // ID 2 = Top Right
        const topRight = points[2];

        // ID 3 = Bottom Left
        const bottomLeft = points[3];

        // ID 4 = Bottom Right
        const bottomRight = points[4];


        console.log("Top Left:", topLeft);
        console.log("Top Right:", topRight);
        console.log("Bottom Left:", bottomLeft);
        console.log("Bottom Right:", bottomRight);


        /* =====================================================
           CREATE MAP BOUNDS
           ===================================================== */

        /*
         * Since the map is a rectangular image aligned
         * north-south/east-west, Leaflet can use the
         * top-left and bottom-right coordinates to define
         * the image bounds.
         */

        const bounds = L.latLngBounds(
            topLeft,
            bottomRight
        );


        /* =====================================================
           CREATE LEAFLET MAP
           ===================================================== */

        map = L.map("map", {
            zoomControl: true,
            attributionControl: true
        });


        /* =====================================================
           ADD MAP IMAGE
           ===================================================== */

        /*
         * map.jpg must be in the same folder as this HTML file.
         */

        L.imageOverlay(
            "map.jpg",
            bounds,
            {
                opacity: 1.0,
                interactive: false
            }
        ).addTo(map);


        /* =====================================================
           INITIAL MAP VIEW
           ===================================================== */

        map.fitBounds(bounds);


        /*
         * Prevent zooming out farther than the complete
         * map image.
         */

        const minimumZoom = map.getZoom();

        map.setMinZoom(minimumZoom);


        /*
         * Prevent excessive panning outside the map.
         */

        map.setMaxBounds(
            bounds.pad(0.02)
        );


        /*
         * Small padding when Leaflet checks the bounds.
         */

        map.options.maxBoundsViscosity = 1.0;


        status.innerHTML =
            "<b>Map loaded</b><br>" +
            "Corner coordinates loaded from corners.csv";


    } catch (error) {

        console.error(error);

        status.innerHTML =
            "<b>Error loading map</b><br>" +
            error.message +
            "<br><br>" +
            "Make sure index.html, corners.csv and map.jpg " +
            "are in the same folder and open the page using " +
            "a local web server.";
    }
}


/* =========================================================
   START GPS
   ========================================================= */

function startLocation() {

    if (!navigator.geolocation) {

        document.getElementById("status").innerHTML =
            "Geolocation is not supported by this browser.";

        return;
    }


    document.getElementById("status").innerHTML =
        "Requesting GPS permission...";


    /*
     * Stop an existing GPS watcher.
     */

    if (watchId !== null) {

        navigator.geolocation.clearWatch(watchId);

    }


    /*
     * Start watching device position.
     */

    watchId = navigator.geolocation.watchPosition(
        updateLocation,
        locationError,
        {
            enableHighAccuracy: true,
            maximumAge: 2000,
            timeout: 15000
        }
    );
}


/* =========================================================
   UPDATE USER LOCATION
   ========================================================= */

function updateLocation(position) {

    if (!map) {
        return;
    }


    const lat =
        position.coords.latitude;

    const lon =
        position.coords.longitude;

    const accuracy =
        position.coords.accuracy || 0;


    const point = [lat, lon];


    /* =====================================================
       CREATE / UPDATE LOCATION MARKER
       ===================================================== */

    if (!locationMarker) {

        const icon = L.divIcon({

            className: "",

            html:
                '<div class="location-dot"></div>',

            iconSize: [24, 24],

            iconAnchor: [12, 12]
        });


        locationMarker = L.marker(
            point,
            {
                icon: icon,
                zIndexOffset: 1000
            }
        ).addTo(map);


        locationMarker.bindPopup(
            "You are here"
        );

    } else {

        locationMarker.setLatLng(point);

    }


    /* =====================================================
       ACCURACY CIRCLE
       ===================================================== */

    if (!accuracyCircle) {

        accuracyCircle = L.circle(
            point,
            {
                radius: accuracy,
                color: "#1677ff",
                fillColor: "#1677ff",
                fillOpacity: 0.10,
                weight: 1
            }
        ).addTo(map);

    } else {

        accuracyCircle.setLatLng(point);

        accuracyCircle.setRadius(
            accuracy
        );

    }


    /* =====================================================
       STATUS
       ===================================================== */

    document.getElementById("status").innerHTML =

        "<b>Location active</b><br>" +

        "Latitude: " +
        lat.toFixed(6) +
        "<br>" +

        "Longitude: " +
        lon.toFixed(6) +
        "<br>" +

        "GPS accuracy: ±" +
        Math.round(accuracy) +
        " m";


    /* =====================================================
       CENTER MAP ON USER ONLY FIRST TIME
       ===================================================== */

    if (!updateLocation.hasCentered) {

        /*
         * Use the current zoom if it is already larger
         * than 16.
         */

        const targetZoom =
            Math.max(map.getZoom(), 16);

        map.setView(
            point,
            targetZoom
        );

        updateLocation.hasCentered = true;
    }
}


/* =========================================================
   GPS ERROR HANDLING
   ========================================================= */

function locationError(error) {

    let message =
        "Unable to obtain location.";

    if (error.code === 1) {

        message =
            "Location permission was denied. " +
            "Please allow location access.";

    } else if (error.code === 2) {

        message =
            "Location is currently unavailable.";

    } else if (error.code === 3) {

        message =
            "GPS request timed out. " +
            "Please try again.";
    }


    document.getElementById("status").innerHTML =
        message;
}


/* =========================================================
   START APPLICATION
   ========================================================= */

loadMap();

</script>

</body>
</html>
