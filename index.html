<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Uji Hazard Map – Live Location</title>

<link rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      crossorigin=""/>

<style>
    html, body {
        height: 100%;
        margin: 0;
        font-family: Arial, sans-serif;
        background: #111;
    }

    #map {
        width: 100%;
        height: 100%;
    }

    .panel {
        position: fixed;
        z-index: 1000;
        top: 12px;
        left: 12px;
        right: 12px;
        max-width: 360px;
        padding: 14px;
        background: rgba(255,255,255,.95);
        border-radius: 12px;
        box-shadow: 0 3px 15px rgba(0,0,0,.25);
    }

    .title {
        font-size: 17px;
        font-weight: 700;
        margin-bottom: 8px;
    }

    .status {
        font-size: 13px;
        line-height: 1.5;
        margin-bottom: 10px;
    }

    button {
        border: 0;
        border-radius: 8px;
        padding: 10px 13px;
        font-size: 14px;
        font-weight: 600;
        background: #1976d2;
        color: white;
        cursor: pointer;
    }

    button:active {
        transform: scale(.98);
    }

    .leaflet-control-attribution {
        font-size: 9px;
    }

    .location-dot {
        width: 18px;
        height: 18px;
        background: #1677ff;
        border: 3px solid white;
        border-radius: 50%;
        box-shadow: 0 0 0 2px rgba(22,119,255,.35), 0 2px 5px rgba(0,0,0,.35);
    }

    .accuracy {
        background: rgba(22,119,255,.12);
        border: 1px solid rgba(22,119,255,.4);
        border-radius: 50%;
    }

    @media (max-width: 600px) {
        .panel {
            top: 8px;
            left: 8px;
            right: 8px;
        }
    }
</style>
</head>

<body>
<div id="map"></div>

<div class="panel">
    <div class="title">Uji Flood Hazard Map</div>
    <div id="status" class="status">
        Waiting for device location…
    </div>
    <button onclick="startLocation()">📍 Show My Location</button>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        crossorigin=""></script>

<script>
const corners = {
  "top left": [
    34.9213509,
    135.7800287
  ],
  "top right": [
    34.92138599,
    135.8249521
  ],
  "bottom left": [
    34.89138938,
    135.77986
  ],
  "bottom right": [
    34.89139947,
    135.8249354
  ]
};

// The supplied image corners:
// top-left, top-right, bottom-left, bottom-right.
const bounds = L.latLngBounds(
    corners["top left"],
    corners["bottom right"]
);

const map = L.map("map", {
    zoomControl: true,
    attributionControl: true
});

// Display the JPG as the geographic map.
// The supplied four corners are used to define its geographic extent.
const image = L.imageOverlay("map.jpg", bounds, {
    opacity: 1.0,
    interactive: false
}).addTo(map);

// Fit the complete map to the screen initially.
map.fitBounds(bounds);

// Prevent the user from zooming out farther than the full map view.
const minimumZoom = map.getZoom();
map.setMinZoom(minimumZoom);

// Keep the user from panning too far outside the map.
map.setMaxBounds(bounds.pad(0.02));

let locationMarker = null;
let accuracyCircle = null;
let watchId = null;

function startLocation() {
    if (!navigator.geolocation) {
        document.getElementById("status").innerHTML =
            "Geolocation is not supported by this browser.";
        return;
    }

    document.getElementById("status").innerHTML =
        "Requesting GPS permission…";

    if (watchId !== null) {
        navigator.geolocation.clearWatch(watchId);
    }

    watchId = navigator.geolocation.watchPosition(
        updateLocation,
        locationError,
        {
            enableHighAccuracy: true,
            maximumAge: 2000,
            timeout: 15000
        }
    );
}

function updateLocation(position) {
    const lat = position.coords.latitude;
    const lon = position.coords.longitude;
    const accuracy = position.coords.accuracy || 0;

    const point = [lat, lon];

    if (!locationMarker) {
        const icon = L.divIcon({
            className: "",
            html: '<div class="location-dot"></div>',
            iconSize: [24, 24],
            iconAnchor: [12, 12]
        });

        locationMarker = L.marker(point, {
            icon: icon,
            zIndexOffset: 1000
        }).addTo(map);

        locationMarker.bindPopup("You are here");
    } else {
        locationMarker.setLatLng(point);
    }

    if (!accuracyCircle) {
        accuracyCircle = L.circle(point, {
            radius: accuracy,
            className: "accuracy",
            color: "#1677ff",
            fillColor: "#1677ff",
            fillOpacity: 0.10,
            weight: 1
        }).addTo(map);
    } else {
        accuracyCircle.setLatLng(point);
        accuracyCircle.setRadius(accuracy);
    }

    document.getElementById("status").innerHTML =
        "<b>Location active</b><br>" +
        "Latitude: " + lat.toFixed(6) + "<br>" +
        "Longitude: " + lon.toFixed(6) + "<br>" +
        "GPS accuracy: ±" + Math.round(accuracy) + " m";

    // Only move the map to the user the first time.
    if (!updateLocation.hasCentered) {
        map.setView(point, Math.max(map.getZoom(), 16));
        updateLocation.hasCentered = true;
    }
}

function locationError(error) {
    let message = "Unable to obtain location.";

    if (error.code === 1) {
        message = "Location permission was denied. Please allow location access.";
    } else if (error.code === 2) {
        message = "Location is currently unavailable.";
    } else if (error.code === 3) {
        message = "GPS request timed out. Please try again.";
    }

    document.getElementById("status").innerHTML = message;
}
</script>
</body>
</html>
