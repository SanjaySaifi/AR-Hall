<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Spatial Awareness Map (SAM)</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{

background:#000;
overflow:hidden;
color:white;

}

#camera{

position:fixed;
top:0;
left:0;
width:100%;
height:100%;
object-fit:cover;
background:black;
z-index:1;

}

#overlay{

position:absolute;
top:0;
left:0;
width:100%;
height:100%;
pointer-events:none;
z-index:2;

}

#topPanel{

position:absolute;
top:15px;
left:15px;
right:15px;

background:rgba(0,0,0,0.45);

backdrop-filter:blur(12px);

padding:15px;

border-radius:15px;

z-index:10;

}

#title{

font-size:24px;
font-weight:bold;

}

#subtitle{

margin-top:3px;

font-size:14px;

color:#dddddd;

}

#status{

margin-top:12px;

display:grid;

grid-template-columns:1fr 1fr;

row-gap:8px;

column-gap:15px;

font-size:15px;

}

.green{

color:#00ff66;

font-weight:bold;

}

.red{

color:#ff4444;

font-weight:bold;

}

#bottomPanel{

position:absolute;

bottom:20px;

left:20px;

right:20px;

z-index:10;

display:flex;

justify-content:center;

}

button{

padding:18px 35px;

font-size:18px;

border:none;

border-radius:40px;

background:#0080ff;

color:white;

cursor:pointer;

box-shadow:0px 5px 15px rgba(0,0,0,.35);

}

button:hover{

background:#0060dd;

}

</style>

</head>

<body>

<video id="camera" autoplay playsinline muted></video>

<canvas id="overlay"></canvas>

<div id="topPanel">

<div id="title">

Spatial Awareness Map

</div>

<div id="subtitle">

Browser-based Geospatial Guidance System

</div>

<div id="status">

<div>Camera</div>
<div id="cameraStatus" class="red">Waiting...</div>

<div>GPS</div>
<div id="gpsStatus" class="red">Waiting...</div>

<div>Latitude</div>
<div id="lat">--</div>

<div>Longitude</div>
<div id="lon">--</div>

<div>Accuracy</div>
<div id="acc">--</div>

<div>Heading</div>
<div id="heading">--</div>

</div>

</div>

<div id="bottomPanel">

<button id="calibrate">

Start Calibration

</button>

</div>

<script>

const video=document.getElementById("camera");

async function startCamera(){

try{

const stream=await navigator.mediaDevices.getUserMedia({

video:{
facingMode:"environment"
},

audio:false

});

video.srcObject=stream;

document.getElementById("cameraStatus").innerHTML="Running";

document.getElementById("cameraStatus").className="green";

}

catch(e){

document.getElementById("cameraStatus").innerHTML="Permission Denied";

}

}

function startGPS(){

if(!navigator.geolocation){

alert("Geolocation not supported");

return;

}

navigator.geolocation.watchPosition(

function(position){

document.getElementById("gpsStatus").innerHTML="Locked";

document.getElementById("gpsStatus").className="green";

document.getElementById("lat").innerHTML=
position.coords.latitude.toFixed(6);

document.getElementById("lon").innerHTML=
position.coords.longitude.toFixed(6);

document.getElementById("acc").innerHTML=
"± "+position.coords.accuracy.toFixed(1)+" m";

},

function(error){

document.getElementById("gpsStatus").innerHTML="Unavailable";

}

);

}

function startCompass(){

if(window.DeviceOrientationEvent){

window.addEventListener(

'deviceorientation',

function(event){

if(event.alpha!=null){

document.getElementById("heading").innerHTML=

Math.round(event.alpha)+"°";

}

}

);

}

}

document.getElementById("calibrate").onclick=function(){

alert(

"Calibration module will be implemented in Version 2."

);

};

startCamera();

startGPS();

startCompass();

</script>

</body>

</html>
